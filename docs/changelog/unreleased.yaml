baseTag: v0.0.3
changes:
  - id: bundled-changelog
    type: changelog.feature
    messages:
      en: View release notes after updates or from Settings, in five languages, with emoji labels for new features, improvements and fixes.
      zh_CN: 更新后自动展示更新日志，也可从设置页查看，支持五种语言，并以 emoji 标记新功能、改进和修复。
      zh_TW: 更新後自動顯示更新日誌，也可從設定頁查看，支援五種語言，並以 emoji 標示新功能、改進與修正。
      ja: 更新後に更新履歴を表示し、設定画面からも確認できます。5言語に対応し、新機能・改善・修正を絵文字付きのラベルで表示します。
      ko: 업데이트 후 변경 내역을 표시하며 설정에서도 확인할 수 있습니다. 5개 언어를 지원하고 새 기능, 개선 및 수정 사항을 이모지 라벨로 표시합니다.
    paths:
      - entrypoints/background/index.ts
      - entrypoints/changelog/App.vue
      - components/changelog/ReleaseHistory.vue
      - components/video/ExtensionGuide.vue
      - locales/en.yaml
      - locales/zh_CN.yaml
      - locales/zh_TW.yaml
      - locales/ja.yaml
      - locales/ko.yaml
    commits: []
  - id: post-action-download-ui
    type: changelog.feature
    messages:
      en: Opt in to the new download UI to place a download icon in the post action row. Click to open the download panel or double-click to download every available video at the highest quality. The legacy UI remains the default for now and will be deprecated soon.
      zh_CN: 可在设置中开启新版下载UI，将下载图标放入帖子操作栏。单击打开下载面板，双击以最高画质下载该帖所有可下载的视频。旧版下载UI 暂时保持默认，很快将废弃。
      zh_TW: 可在設定中開啟新版下載UI，將下載圖示放入貼文操作列。按一下開啟下載面板，按兩下以最高畫質下載該貼文所有可下載的影片。舊版下載UI 暫時維持預設，即將棄用。
      ja: 設定で新しいダウンロード UI を有効にすると、ポストのアクションバーにダウンロードアイコンを表示します。クリックでパネルを開き、ダブルクリックでダウンロード可能なすべての動画を最高画質で保存できます。旧 UI は当面既定のままですが、近日中に廃止予定です。
      ko: 설정에서 새 다운로드 UI를 켜면 게시물 작업 표시줄에 다운로드 아이콘이 표시됩니다. 클릭하면 다운로드 패널을 열고, 두 번 클릭하면 다운로드 가능한 모든 동영상을 최고 화질로 다운로드합니다. 기존 UI는 당분간 기본값으로 유지되지만 곧 지원이 중단됩니다.
    paths:
      - components/video/ToolbarDownloadButton.vue
      - components/video/DownloadSettings.vue
      - entrypoints/content/index.ts
      - utils/settings.ts
      - composables/useDownloadPreferences.ts
      - locales/en.yaml
      - locales/zh_CN.yaml
      - locales/zh_TW.yaml
      - locales/ja.yaml
      - locales/ko.yaml
    commits: []
  - id: inline-download-style
    type: changelog.improvement
    messages:
      en: Lighter post download controls use a shorter Download label, muted icons and blue hover feedback while keeping their existing position and behavior.
      zh_CN: 帖子下方的下载控件采用更轻量的样式，简化下载文案，搭配灰色图标与蓝色悬停反馈，保留原有位置和交互。
      zh_TW: 貼文下方的下載控制項採用更輕量的樣式，簡化下載文字，搭配灰色圖示與藍色懸停回饋，保留原有位置與互動。
      ja: ポスト下部のダウンロード操作を軽量なデザインに変更しました。短いラベル、グレーのアイコン、ホバー時の青い表示を採用し、位置と操作は維持しています。
      ko: 게시물 아래 다운로드 컨트롤에 짧은 다운로드 문구, 회색 아이콘과 파란색 호버 효과를 적용했습니다. 기존 위치와 동작은 유지됩니다.
    paths:
      - components/video/InlineDownloadButton.vue
      - locales/en.yaml
      - locales/zh_CN.yaml
      - locales/zh_TW.yaml
      - locales/ja.yaml
      - locales/ko.yaml
    commits: []
