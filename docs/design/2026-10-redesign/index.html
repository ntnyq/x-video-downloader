<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f2" />
    <link rel="icon" href="data:," />
    <title>X 视频下载器 · 界面设计</title>
    <link rel="stylesheet" href="./design.css" />
  </head>
  <body>
    <a class="skip" href="#board">跳到设计图</a>
    <nav class="review-nav" aria-label="设计图导航">
      <a class="review-brand" href="?view=workspace"
        >X 视频下载器 <span>设计预览</span></a
      >
      <div id="navigation"></div>
      <span class="prototype-note">示例数据 · 不执行真实下载</span>
    </nav>
    <main id="board" class="board"></main>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">清理已结束记录？</h2>
      <p>只清理当前筛选中的记录，保留下载文件。清理后不再提醒重复下载。</p>
      <div class="dialog-actions">
        <button class="button" data-action="dismiss">取消</button
        ><button class="button primary" data-action="confirm-clear">
          清理记录
        </button>
      </div>
    </dialog>
    <script>
      const paths = {
        download:
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
        settings:
          '<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
        refresh:
          '<path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-2L20 8M4 16l2.4 3A7 7 0 0 0 18 17"/>',
        close: '<path d="m6 6 12 12M6 18 18 6"/>',
        chevron: '<path d="m6 9 6 6 6-6"/>',
        right: '<path d="m9 6 6 6-6 6"/>',
        external:
          '<path d="M15 3h6v6m0-6L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',
        film: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        history: '<path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/>',
        pause: '<path d="M8 5v14M16 5v14"/>',
        play: '<path d="m8 5 11 7-11 7Z"/>',
        search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
        trash: '<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
        alert:
          '<path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8-14a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"/>',
        folder:
          '<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
        palette:
          '<circle cx="7.5" cy="10.5" r=".5"/><circle cx="10.5" cy="6.5" r=".5"/><circle cx="15.5" cy="7.5" r=".5"/><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-3.7 1 1 0 0 1 .5-1.8H17A4 4 0 0 0 21 11a9 9 0 0 0-9-8Z"/>',
        help: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4M12 17h.01"/>',
        link: '<path d="m10 13 4-4M7.5 16.5l-1 1a4 4 0 0 1-5.7-5.7l4-4a4 4 0 0 1 5.7 0m3 0 1-1a4 4 0 0 1 5.7 5.7l-4 4a4 4 0 0 1-5.7 0" transform="translate(2 0)"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M8 13h8M8 17h5"/>',
        keyboard:
          '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 15h6"/>',
        moon: '<path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/>',
        arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
        pin: '<path d="m16 3 5 5-4 1-4 5v4l-3-3-6 6 6-6-3-3h4l5-4Z"/>',
      }
      const icon = (name, cls = '') =>
        `<svg class="icon ${cls}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.film}</svg>`
      const ib = (name, label, action = 'feedback') =>
        `<button class="icon-button" type="button" aria-label="${label}" title="${label}" data-action="${action}">${icon(name)}</button>`
      const btn = (text, name = '', cls = '', action = 'feedback') =>
        `<button type="button" class="button ${cls}" data-action="${action}">${name ? icon(name) : ''}${text}</button>`
      const check = (label, checked = true, cls = '') =>
        `<label class="check-label ${cls}"><input type="checkbox" aria-label="${label}" ${checked ? 'checked' : ''} /><span>${label}</span></label>`
      const select = (label, options, cls = '') =>
        `<span class="select-wrap ${cls}"><select aria-label="${label}">${options.map(x => `<option>${x}</option>`).join('')}</select>${icon('chevron')}</span>`
      const brand = () =>
        `<span class="brand-symbol">${icon('download')}</span><strong>X 视频下载器</strong>`
      function head(title, subtitle) {
        return `<header class="board-heading"><div><p class="project-label">X 视频下载器 / 界面重设计</p><h1>${title}</h1><p>${subtitle}</p></div><div class="edition">设计提案<br><span>2026.10</span></div></header>`
      }
      function caption(title, text) {
        return `<figcaption><strong>${title}</strong><p>${text}</p></figcaption>`
      }
      function panelHeader(close = false) {
        return `<header class="panel-header"><div class="brand">${brand()}</div><div class="row">${ib('settings', '设置', 'settings')}${close ? ib('close', '关闭下载面板', 'close-panel') : ''}</div></header>`
      }
      function tabs(active = 'videos') {
        return `<div class="tabs" aria-label="下载视图"><button class="${active === 'videos' ? 'active' : ''}" data-action="videos">${icon('film')}页面视频 <span class="tab-count">4</span></button><button class="${active === 'history' ? 'active' : ''}" data-action="history">${icon('history')}下载记录 <span class="activity-dot" aria-label="有进行中的下载"></span></button></div>`
      }
      function mediaRow(
        index,
        checked = true,
        quality = '1080p',
        unsupported = false,
      ) {
        return `<div class="media-row ${unsupported ? 'unavailable' : ''}">${unsupported ? `<span class="disabled-check"></span>` : check(`选择视频 ${index}`, checked, 'icon-check')}<span class="media-symbol">${icon('film')}</span><div class="media-main"><strong>视频 ${index}</strong><span class="minor">${unsupported ? '仅 HLS，暂不支持' : 'MP4'}</span></div>${unsupported ? ib('info', '暂不支持 HLS 分片合并') : `${select(`视频 ${index}画质`, [quality, ...(quality === '1080p' ? ['720p', '480p'] : ['1080p', '480p'])], 'quality')}${ib('download', `下载视频 ${index}`, 'download')}`}</div>`
      }
      function post(author, text, rows, one = false) {
        return `<section class="post-group"><div class="post-heading">${one ? '' : check(`选择 @${author} 的视频`, true, 'icon-check')}<a href="https://x.com/i/status/2105974296740811141" target="_blank" rel="noreferrer" title="打开示例原帖">@${author}${icon('external')}</a></div><p class="post-copy">${text}</p>${rows}</section>`
      }
      function videos(single = false) {
        return `<div class="panel-content"><div class="list-toolbar">${single ? `<button class="text-button" data-action="show-all">${icon('right', 'back-icon')}全部视频</button><span class="minor">当前帖子</span>` : `${check('全选', false, 'select-all')}<span class="minor available-count">3 个可下载</span>${ib('refresh', '重新检测', 'refresh')}`}</div><div class="video-list">${post('ntnyq', '周末的海边，想把这一刻留下来。', mediaRow(1) + (single ? '' : mediaRow(2, true, '720p')), single)}${single ? '' : post('slow_frames', '城市的另一面。', mediaRow(1, false) + mediaRow(2, false, '', true))}</div></div><footer class="batch-footer"><span class="minor selection-label">已选 ${single ? '1' : '2'} 个</span>${btn(single ? '下载视频' : '下载所选', 'download', 'primary', 'batch-download')}</footer>`
      }
      function downloadItem(author, filename, state, percent = 0) {
        const states = {
          downloading: ['下载中', 'download'],
          paused: ['已暂停', 'pause'],
          queued: ['等待中', 'clock'],
          complete: ['已完成', 'check'],
          failed: ['下载失败', 'alert'],
        }
        const [label, name] = states[state]
        const actions =
          state === 'downloading'
            ? ib('pause', `暂停 ${filename}`, 'pause')
              + ib('close', `取消 ${filename}`, 'cancel-download')
            : state === 'paused'
              ? ib('play', `继续 ${filename}`, 'resume')
                + ib('close', `取消 ${filename}`, 'cancel-download')
              : state === 'queued'
                ? ib('pause', `暂停 ${filename}`, 'pause')
                  + ib('close', `取消 ${filename}`, 'cancel-download')
                : (state === 'failed'
                    ? ib('refresh', `重试 ${filename}`, 'retry')
                    : '') + ib('trash', `移除 ${filename} 的记录`, 'clear')
        return `<article class="download-item" data-author="${author}"><div class="download-top"><span class="status-icon ${state}">${icon(name)}</span><div class="download-name"><strong title="${filename}">${filename}</strong><a href="https://x.com/i/status/2105974296740811141" target="_blank" rel="noreferrer">@${author}${icon('external')}</a></div><div class="download-actions">${actions}</div></div>${percent ? `<div class="progress" role="progressbar" aria-label="${filename} 下载进度" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${percent}%"></span></div>` : ''}<div class="download-meta ${state}"><span>${state === 'failed' ? '网络中断，请重试' : label}</span><span>${percent ? `${percent === 62 ? '14.9 / 24.0' : '3.2 / 10.0'} MB` : state === 'complete' ? '18.6 MB' : ''}${percent ? `<b>${percent}%</b>` : ''}</span></div></article>`
      }
      function history() {
        return `<div class="panel-content history-content"><div class="history-filter"><label class="search-box">${icon('search')}<input type="search" name="download-search" aria-label="搜索文件名、作者或帖子 ID" placeholder="搜索下载记录…" autocomplete="off" /></label>${select('按作者筛选', ['全部作者', '@ntnyq', '@slow_frames'], 'author-select')}</div><div class="history-toolbar"><span class="minor history-count">5 条记录</span><button class="text-button" data-action="clear">${icon('trash')}清理</button></div><div class="download-list">${downloadItem('ntnyq', 'ntnyq_2026-10-02_1_1920x1080.mp4', 'downloading', 62)}${downloadItem('ntnyq', 'ntnyq_2026-10-02_2_1280x720.mp4', 'paused', 32)}${downloadItem('slow_frames', 'slow_frames_2026-10-02_1.mp4', 'queued')}${downloadItem('slow_frames', 'slow_frames_2026-10-01_1.mp4', 'failed')}${downloadItem('ntnyq', 'ntnyq_2026-09-30_1_1920x1080.mp4', 'complete')}</div><p class="search-empty" hidden>没有匹配的记录</p></div>`
      }
      function panel(
        active = 'videos',
        dark = false,
        single = false,
        close = false,
      ) {
        return `<section class="panel ${dark ? 'dark' : ''}" data-panel ${single ? 'data-single' : ''}>${panelHeader(close)}${tabs(active)}<div class="panel-view">${active === 'history' ? history() : videos(single)}</div></section>`
      }
      function workspace() {
        return (
          head(
            '少一点文案，快一步保存。',
            '工具栏弹窗与页内面板共用布局。作者和画质留在眼前，批量下载固定在底部。',
          )
          + `<div class="three-up"><figure>${panel()}${caption('页面视频 · 360 × 600', '单条下载用图标，批量下载保留明确文字。')}</figure><figure>${panel('history')}${caption('下载记录 · 状态与动作相邻', '搜索与筛选合为一行，清理说明在确认时出现。')}</figure><figure>${panel('videos', true)}${caption('深色模式 · 同一套信息层级', '沿用黑白灰，状态同时使用图标与文字。')}</figure></div><div class="design-note"><span>${icon('check')}保留单视频、批量、画质、队列控制</span><span>${icon('check')}帖子 ID 收入原帖链接与详情</span><span>${icon('check')}说明按需展开</span></div>`
        )
      }
      function context() {
        return (
          head(
            '下载入口，留在视频旁。',
            '单视频直接下载；多视频打开当前帖子。浮动入口和 Alt + O 继续可用。',
          )
          + `<div class="browser-scene"><div class="browser-toolbar"><span class="window-dots">● ● ●</span><div>${icon('link')}x.com / ntnyq / status / 2105974296740811141</div>${icon('settings')}</div><div class="x-layout"><aside class="x-sidebar"><b class="x-logo">𝕏</b><span>首页</span><span>探索</span><span>通知</span><span>私信</span><span>个人资料</span></aside><div class="x-feed"><div class="x-feed-title">帖子</div><div class="mock-post"><div class="author-avatar">n</div><div><strong>ntnyq</strong><p class="minor">@ntnyq</p></div><span class="minor post-date">10 月 2 日</span></div><p class="x-post-copy">周末的海边，想把这一刻留下来。</p><div class="mock-video" aria-label="示意视频播放器"><span>${icon('play')}</span><div><i></i><small>0:12 / 0:28</small></div></div><div class="x-metrics"><span>♡ 128</span><span>↻ 24</span><span>▥ 2,048</span></div><div class="inline-download"><div class="split-button">${btn('下载', 'download', '', 'download')}<button aria-label="选择画质和查看进度" title="选择画质和查看进度" data-action="open-panel">${icon('chevron')}</button></div><kbd>Alt O</kbd></div><div class="mock-next-post"><div class="author-avatar secondary-avatar">s</div><div><strong>slow_frames</strong><p class="minor">城市的另一面。</p></div></div></div><div class="x-right"><div class="muted-search">搜索</div><h3>正在发生</h3><p>设计与创作</p><p>摄影</p></div></div><div class="context-panel">${panel('videos', false, true, true)}</div><button class="launcher" aria-label="打开下载面板" title="打开下载面板 · 可拖动" data-action="open-panel">${icon('download')}</button></div><div class="context-notes"><div><strong>一个下载入口</strong><p>主按钮执行默认画质下载，箭头展开画质与进度。</p></div><div><strong>当前帖子，有路可退</strong><p>从帖子打开时仅显示该帖，点“全部视频”返回页面列表。</p></div><div><strong>浮动面板，不打断浏览</strong><p>Esc 关闭并归还焦点；选择器的 Esc 只关闭选择器。</p></div></div>`
        )
      }
      const colors = [
        ['黑白', '#0f1419'],
        ['X 蓝', '#1d9bf0'],
        ['海蓝', '#2563eb'],
        ['青绿', '#0d9488'],
        ['翠绿', '#16a34a'],
        ['青柠', '#84cc16'],
        ['琥珀', '#f59e0b'],
        ['橙色', '#ea580c'],
        ['红色', '#dc2626'],
        ['玫红', '#db2777'],
        ['紫色', '#9333ea'],
        ['靛蓝', '#4f46e5'],
      ]
      function settingRow(label, control, help = '') {
        return `<div class="setting-row"><div><span class="setting-label">${label}</span>${help ? `<p class="minor">${help}</p>` : ''}</div>${control}</div>`
      }
      function settingsContent(narrow = false) {
        return `<div class="settings-content"><div class="settings-title"><h2>设置</h2><span class="saved-label">${icon('check')}自动保存偏好</span></div><section class="settings-section"><h3>${icon('download')}下载</h3>${settingRow('默认画质', select('默认画质', ['最高画质', '优先 1080p', '优先 720p', '节省空间']))}${settingRow('同时下载', select('同时下载数量', ['3 个', '1 个', '2 个', '4 个', '5 个', '6 个']))}${settingRow('每次询问保存位置', '<label class="switch"><input type="checkbox" role="switch" aria-label="每次询问保存位置" /><span></span></label>')}<details class="quiet-details"><summary>下载规则 ${icon('chevron')}</summary><p>其余任务进入队列。默认保存到浏览器下载目录；开启询问后，每个视频都需确认位置。画质优先选择不超过目标的分辨率，竖屏按短边计算。</p></details></section><section class="settings-section filename-section"><div class="section-title"><h3>${icon('file')}文件名</h3><button class="text-button" data-action="reset-template">恢复默认</button></div><label class="sr-only" for="filename-${narrow ? 'small' : 'large'}">文件名模板</label><input class="input filename-input" id="filename-${narrow ? 'small' : 'large'}" name="filename-template" value="{author}_{date}_{index}_{quality}" spellcheck="false" autocomplete="off" maxlength="160" aria-describedby="filename-preview-${narrow ? 'small' : 'large'}" /><div class="filename-tokens">${['作者', '日期', '帖子 ID', '序号', '分辨率'].map((x, i) => `<button type="button" data-action="token" data-token="${['author', 'date', 'postId', 'index', 'quality'][i]}">${x}</button>`).join('')}</div><div class="filename-preview" id="filename-preview-${narrow ? 'small' : 'large'}">${icon('file')}<span>ntnyq_2026-10-02_1_1920x1080.mp4</span></div><div class="filename-actions"><span class="minor">自动添加 .mp4</span>${btn('保存模板', '', '', 'save-template')}</div></section><section class="settings-section appearance-section"><h3>${icon('palette')}外观</h3><div class="swatches" aria-label="强调色">${colors.map(([label, color], i) => `<button class="swatch ${i === 0 ? 'selected' : ''}" style="--swatch:${color}" aria-label="${label}" title="${label}" aria-pressed="${i === 0}" data-action="color">${i === 0 ? icon('check') : ''}</button>`).join('')}</div><div class="appearance-footer"><span class="minor selected-color">黑白</span><details class="custom-color"><summary>自定义 ${icon('chevron')}</summary><div><input class="input" name="custom-color" aria-label="自定义 RGB 颜色" placeholder="例如 29, 155, 240…" autocomplete="off" spellcheck="false" />${btn('应用', '', '', 'custom-color')}</div></details></div><p class="minor mode-note">明暗跟随 X 页面或系统</p></section><details class="help-section"><summary>${icon('help')}使用帮助${icon('chevron')}</summary><div><p>刷新已打开的 X 页面，播放视频后再检测。</p><p>支持 MP4 与视频形式的 GIF；暂不支持仅 HLS 的视频。</p><p>仅在本机处理已加载的视频信息。只保存你有权下载的内容。</p><p>语言跟随浏览器，支持简中、繁中、英语、日语、韩语。</p><p>按 Alt + O 打开面板。</p></div></details></div>`
      }
      function settings() {
        return (
          head(
            '设置按用途分组，解释按需出现。',
            '保留全部下载偏好、12 种强调色和自定义 RGB。文件名预览代替长篇变量说明。',
          )
          + `<div class="settings-layout"><figure class="desktop-settings"><div class="settings-app"><header class="settings-app-header"><div class="brand">${brand()}</div><a href="?view=welcome" class="text-link">使用指南${icon('external')}</a></header>${settingsContent()}</div>${caption('独立设置页', '下载 → 文件名 → 外观。即时保存与手动保存有明确边界。')}</figure><figure class="narrow-settings"><div class="settings-app"><header class="settings-app-header"><div class="brand">${brand()}</div>${ib('help', '使用帮助', 'welcome')}</header>${settingsContent(true)}</div>${caption('窄屏 · 320 px', '控件按内容换行，保持完整点击区域。')}</figure></div>`
        )
      }
      function welcome() {
        return (
          head(
            '第一次打开，只做一件事。',
            '欢迎页只负责让用户开始下载，完整偏好留在设置页。',
          )
          + `<div class="welcome-app"><header class="settings-app-header"><div class="brand">${brand()}</div><a href="?view=settings" class="text-link">设置 ${icon('settings')}</a></header><div class="welcome-body"><div class="welcome-copy"><span class="installed">${icon('check')}已安装</span><h2>把想留住的，<br>保存下来。</h2><p>刷新已打开的 X 页面，<br>找到视频，点击下载。</p><a href="https://x.com" target="_blank" rel="noreferrer" class="button primary">打开 X ${icon('external')}</a><div class="shortcut">${icon('keyboard')}随时用 <kbd>Alt</kbd><kbd>O</kbd> 打开面板</div></div><div class="welcome-illustration" aria-label="下载使用流程示意"><div class="illustration-post"><div class="mock-post"><div class="author-avatar">n</div><div><strong>ntnyq</strong><p class="minor">@ntnyq</p></div></div><p>周末的海边，想把这一刻留下来。</p><div class="welcome-video">${icon('play')}</div><div class="illustration-action"><span class="minor">视频已加载</span><span class="button primary">${icon('download')}下载</span></div></div><div class="saved-file"><span class="file-icon">${icon('file')}</span><div><strong>ntnyq_2026-10-02.mp4</strong><p>${icon('check')}已保存到下载目录</p></div></div></div></div><div class="welcome-steps"><div><span class="step-number">1</span><div><h3>打开视频</h3><p>等待播放器加载</p></div></div><div><span class="step-number">2</span><div><h3>点击下载</h3><p>需要时再选画质</p></div></div><div><span class="step-number">3</span><div><h3>查看进度</h3><p>在面板管理下载</p></div></div></div><footer class="welcome-footer"><span>${icon('info')}仅在本机处理视频信息</span><a href="?view=settings" class="text-link">使用帮助 ${icon('right')}</a></footer></div><div class="design-note"><span>${icon('check')}首屏一个主操作</span><span>${icon('check')}不重复展示整页设置</span><span>${icon('check')}引导文案可迁移至五种语言</span></div>`
        )
      }
      function emptyState(
        name,
        title,
        body,
        actionText = '',
        action = 'feedback',
      ) {
        return `<div class="empty-state"><div class="empty-icon">${icon(name)}</div><h3>${title}</h3><p>${body}</p>${actionText ? btn(actionText, name === 'link' ? 'external' : 'refresh', '', action) : ''}</div>`
      }
      function stateCard(label, html, cls = '') {
        return `<figure class="state-card ${cls}"><div class="state-surface">${html}</div>${caption(label, '')}</figure>`
      }
      function states() {
        return (
          head(
            '空白与失败，也有清楚的下一步。',
            '不把技术说明放在常规流程里。需要用户判断时，才出现一句解释和明确操作。',
          )
          + `<div class="state-grid">${stateCard('未打开 X', emptyState('link', '先打开一个 X 视频', '在含视频的帖子中使用下载器。', '打开 X', 'open-x'))}${stateCard('已连接 · 尚未找到视频', emptyState('film', '还没有发现视频', '播放一下视频，再重新检测。', '重新检测', 'refresh'))}${stateCard('刚安装 / 页面未连接', emptyState('refresh', '刷新 X 页面后继续', '刷新后点击重新检测。', '重新检测', 'refresh'))}${stateCard('正在检测', `<div class="skeleton-state"><div class="row">${icon('refresh')}<strong>正在检测…</strong></div><div class="skeleton-line long"></div><div class="skeleton-block"></div><div class="skeleton-line"></div><div class="skeleton-block"></div></div>`)}${stateCard('重复下载确认', `<div class="inline-notice">${icon('history')}<h3>1 个视频已下载过</h3><p>要再次保存这个视频吗？</p><div class="notice-actions">${btn('跳过', '', '', 'skip')}${btn('再次下载', '', 'primary', 'download')}</div></div>`)}${stateCard('清理记录确认', `<div class="inline-notice"><h3>清理 3 条已结束记录？</h3><p>保留下载文件。清理后不再提醒重复下载。</p><div class="notice-actions">${btn('取消', '', '', 'dismiss')}${btn('清理记录', '', 'primary', 'clear')}</div></div>`)}${stateCard('仅 HLS · 不可勾选', `<div class="unsupported-state"><div class="post-heading"><strong>@slow_frames</strong></div>${mediaRow(1, false, '', true)}<div class="compact-notice">${icon('info')}暂不支持合并 HLS 分片。<br>这个视频无法直接保存为 MP4。</div></div>`)}${stateCard('请求失败 · 行内重试', `<div class="error-state"><div class="row">${icon('alert')}<strong>下载未开始</strong></div><p>刷新原帖后重试。</p>${btn('打开原帖', 'external', '', 'open-post')}<div class="compact-notice">其他任务不受影响。</div></div>`)}</div><div class="state-bottom"><div class="filename-error-example"><label for="invalid-template">文件名模板</label><input class="input" id="invalid-template" name="invalid-template" value="{author}/{date}" aria-invalid="true" aria-describedby="template-error" autocomplete="off" spellcheck="false" /><p id="template-error">不能包含 /。请用下划线连接。</p></div><div class="feedback-example"><div class="mini-toast">${icon('check')}已加入下载队列 <button data-action="history-board">查看</button></div><p class="minor">成功反馈短暂显示，失败信息保留到处理完成。</p></div><div class="focus-example">${ib('download', '下载视频 1', 'download')}<span>下载视频 1</span><p class="minor">图标有可访问名称、悬停提示和键盘焦点。</p></div></div>`
        )
      }
      function detailsView() {
        return (
          head(
            '展开时，才给足信息。',
            '紧凑的默认视图，完整的展开状态。让组件承担选择、反馈和可访问性，而不是增加装饰。',
          )
          + `<div class="detail-grid"><figure><div class="detail-surface"><div class="detail-top"><span>视频 1</span><span class="mini-select">1080p ${icon('chevron')}</span></div><div class="quality-menu" aria-label="画质菜单示意"><div class="quality-choice selected"><div><strong>1080p <small>最高画质</small></strong><p>1920 × 1080 <span>4.00 Mbps</span></p></div>${icon('check')}</div><div class="quality-choice"><div><strong>720p</strong><p>1280 × 720 <span>2.05 Mbps</span></p></div></div><div class="quality-choice"><div><strong>480p</strong><p>854 × 480 <span>0.83 Mbps</span></p></div></div></div></div>${caption('画质选择 · Select', '收起只显示清晰度；展开后用分辨率与码率区分版本。')}</figure><figure><div class="detail-surface"><div class="section-title"><h3>自定义颜色</h3>${icon('palette')}</div><label class="minor" for="rgb-detail">RGB</label><div class="custom-rgb-row"><input id="rgb-detail" class="input" value="37, 99, 235" name="rgb-detail" autocomplete="off" spellcheck="false" />${btn('应用', '', '', 'custom-color')}</div><div class="color-preview"><span class="rgb-swatch"></span><span>37, 99, 235</span></div><div class="preview-action"><span class="minor">按钮预览</span><span class="button blue-button">${icon('download')}下载所选</span></div><p class="detail-help">每个通道为 0–255 的整数。</p></div>${caption('自定义颜色 · Input / Button', '保留颜色能力，用实时按钮预览解释实际效果。')}</figure><figure><div class="detail-surface file-details"><div class="section-title"><h3>下载详情</h3>${icon('file')}</div><p class="full-filename">ntnyq_2026-10-02_2105974296740811141_1_1920x1080.mp4</p><dl><div><dt>来源</dt><dd>@ntnyq ${icon('external')}</dd></div><div><dt>帖子 ID</dt><dd>2105974296740811141</dd></div><div><dt>状态</dt><dd>${icon('check')}已完成</dd></div><div><dt>大小</dt><dd>18.6 MB</dd></div></dl></div>${caption('下载详情 · Collapsible（拟新增）', '列表省略长文件名；展开后可复制完整信息。')}</figure><figure><div class="detail-surface compact-statuses"><div class="section-title"><h3>其他结束状态</h3>${icon('history')}</div><div class="terminal-row"><div>${icon('close')}<strong>已取消</strong></div><div>${ib('refresh', '重试已取消任务', 'retry')}${ib('trash', '移除已取消记录', 'clear')}</div></div><div class="terminal-row"><div>${icon('file')}<strong>记录已移除</strong></div><div>${ib('refresh', '重试已移除任务', 'retry')}${ib('trash', '移除记录', 'clear')}</div></div><p class="detail-help">只展示当前状态可用的操作。</p></div>${caption('任务操作 · Button / Progress', '暂停与继续互斥，失败、取消和记录移除后提供重试。')}</figure><figure><div class="detail-surface empty-detail">${emptyState('history', '还没有下载记录', '保存的视频会出现在这里。')}<div class="no-match">${icon('search')}没有匹配的记录 <button class="text-button" data-action="clear-filter">清除筛选</button></div></div>${caption('记录为空 / 搜索无结果', '区分首次使用和筛选为空，不把二者混成一种提示。')}</figure><figure><div class="detail-surface help-detail"><h3>没有检测到视频？</h3><p>先播放视频，再重新检测。安装或更新后，请刷新 X 页面。</p><div class="help-rule"></div><h3>支持哪些格式？</h3><p>MP4 与视频形式的 GIF。暂不支持仅 HLS 分片的视频。</p><div class="help-rule"></div><p class="detail-help">只保存你有权下载的内容。插件在本机读取已加载的视频信息。</p></div>${caption('使用帮助 · Collapsible（拟新增）', '低频说明统一放在帮助中，需要时可通过键盘展开。')}</figure></div><div class="design-note"><span>${icon('check')}保留 shadcn-vue 与 Reka UI</span><span>${icon('check')}保留 Shadow DOM 内的弹层挂载</span><span>${icon('check')}所有图标按钮有名称与焦点</span></div>`
        )
      }
      const views = {
        workspace: ['下载面板', workspace],
        context: ['X 页内', context],
        settings: ['设置', settings],
        welcome: ['欢迎', welcome],
        states: ['状态', states],
        details: ['展开细节', detailsView],
      }
      const view =
        new URLSearchParams(location.search).get('view') || 'workspace'
      const currentView = views[view] ? view : 'workspace'
      document.querySelector('#navigation').innerHTML = Object.entries(views)
        .map(
          ([key, [name]]) =>
            `<a href="?view=${key}" ${key === currentView ? 'aria-current="page"' : ''}>${name}</a>`,
        )
        .join('')
      document.querySelector('#board').innerHTML = views[currentView][1]()
      document.body.dataset.view = currentView
      function notify(message) {
        const toast = document.querySelector('#toast')
        toast.textContent = message
        toast.hidden = false
        clearTimeout(window.toastTimer)
        window.toastTimer = setTimeout(() => {
          toast.hidden = true
        }, 3000)
      }
      function updateSelection(panel) {
        if (!panel) return
        const controls = [
          ...panel.querySelectorAll('.media-row input[type="checkbox"]'),
        ]
        const selected = controls.filter(input => input.checked).length
        const status = panel.querySelector('.selection-label')
        if (status) status.textContent = `已选 ${selected} 个`
        const batch = panel.querySelector('[data-action="batch-download"]')
        if (batch) batch.disabled = selected === 0
        const all = panel.querySelector('.select-all input')
        if (all) {
          all.checked = selected === controls.length
          all.indeterminate = selected > 0 && selected < controls.length
        }
        panel.querySelectorAll('.post-group').forEach(group => {
          const box = group.querySelector('.post-heading input')
          const rows = [...group.querySelectorAll('.media-row input')]
          if (box) {
            box.checked = rows.every(input => input.checked)
            box.indeterminate =
              rows.some(input => input.checked) && !box.checked
          }
        })
      }
      document.querySelectorAll('[data-panel]').forEach(updateSelection)
      document.addEventListener('change', event => {
        const panel = event.target.closest('[data-panel]')
        if (event.target.matches('.select-all input'))
          panel.querySelectorAll('.media-row input').forEach(input => {
            input.checked = event.target.checked
          })
        if (event.target.matches('.post-heading input'))
          event.target
            .closest('.post-group')
            .querySelectorAll('.media-row input')
            .forEach(input => {
              input.checked = event.target.checked
            })
        updateSelection(panel)
        if (
          event.target.closest('.settings-section')
          && !event.target.matches('.filename-input')
        )
          notify('演示：偏好已保存')
        if (event.target.matches('.author-select select'))
          filterHistory(event.target.closest('.history-content'))
      })
      function filterHistory(scope) {
        const term = scope
          .querySelector('input[type="search"]')
          .value.toLowerCase()
        const author = scope.querySelector('select').value
        const items = [...scope.querySelectorAll('.download-item')]
        items.forEach(item => {
          item.hidden =
            !item.textContent.toLowerCase().includes(term)
            || (author !== '全部作者' && `@${item.dataset.author}` !== author)
        })
        const count = items.filter(item => !item.hidden).length
        scope.querySelector('.history-count').textContent = `${count} 条记录`
        scope.querySelector('.search-empty').hidden = count > 0
      }
      document.addEventListener('input', event => {
        if (event.target.matches('input[type="search"]'))
          filterHistory(event.target.closest('.history-content'))
        if (event.target.matches('.filename-input')) {
          const values = {
            author: 'ntnyq',
            date: '2026-10-02',
            postId: '2105974296740811141',
            index: '1',
            quality: '1920x1080',
          }
          const scope = event.target.closest('.filename-section')
          scope.querySelector('.filename-preview span').textContent =
            event.target.value
              .replace(/\{(\w+)\}/g, (_, key) => values[key] || `{${key}}`)
              .replace(/\.mp4$/, '') + '.mp4'
        }
      })
      document.addEventListener('click', event => {
        const control = event.target.closest('[data-action]')
        if (!control) return
        const action = control.dataset.action
        const panel = control.closest('[data-panel]')
        if (action === 'settings' || action === 'welcome') {
          location.search = `?view=${action}`
          return
        }
        if (
          action === 'videos'
          || action === 'history'
          || action === 'show-all'
        ) {
          if (!panel) {
            notify('演示：打开下载记录')
            return
          }
          panel.removeAttribute('data-single')
          panel.querySelector('.panel-view').innerHTML =
            action === 'history' ? history() : videos(false)
          panel
            .querySelectorAll('.tabs button')
            .forEach(button =>
              button.classList.toggle(
                'active',
                button.dataset.action
                  === (action === 'history' ? 'history' : 'videos'),
              ),
            )
          updateSelection(panel)
          return
        }
        if (action === 'download' || action === 'batch-download') {
          notify('演示：已加入下载队列')
          return
        }
        if (action === 'refresh') {
          notify('演示：已重新检测')
          return
        }
        if (action === 'close-panel') {
          document.querySelector('.context-panel')?.setAttribute('hidden', '')
          document.querySelector('.launcher')?.focus()
          return
        }
        if (action === 'open-panel') {
          document.querySelector('.context-panel')?.removeAttribute('hidden')
          document
            .querySelector('.context-panel [data-action="close-panel"]')
            ?.focus()
          return
        }
        if (action === 'clear') {
          document.querySelector('#confirm-dialog').showModal()
          return
        }
        if (action === 'dismiss') {
          document.querySelector('#confirm-dialog').close()
          return
        }
        if (action === 'confirm-clear') {
          document.querySelector('#confirm-dialog').close()
          notify('演示：已清理结束记录，文件未删除')
          return
        }
        if (action === 'color') {
          control
            .closest('.settings-content')
            .querySelectorAll('.swatch')
            .forEach(button => {
              button.classList.toggle('selected', button === control)
              button.setAttribute('aria-pressed', String(button === control))
              button.innerHTML = button === control ? icon('check') : ''
            })
          control
            .closest('.settings-content')
            .querySelector('.selected-color').textContent = control.title
          notify(`演示：强调色已设为${control.title}`)
          return
        }
        if (action === 'token' || action === 'reset-template') {
          const input = control
            .closest('.filename-section')
            .querySelector('.filename-input')
          if (action === 'reset-template')
            input.value = '{author}_{date}_{postId}_{index}_{quality}'
          else
            input.setRangeText(
              `{${control.dataset.token}}`,
              input.selectionStart,
              input.selectionEnd,
              'end',
            )
          input.dispatchEvent(new Event('input', { bubbles: true }))
          input.focus()
          return
        }
        if (action === 'save-template') {
          const input = control
            .closest('.filename-section')
            .querySelector('.filename-input')
          const invalid =
            !input.value.trim()
            || /[\\/:*?"<>|]/.test(input.value)
            || /[{}]/.test(
              input.value.replace(
                /\{(author|date|postId|index|quality)\}/g,
                '',
              ),
            )
          input.setAttribute('aria-invalid', String(invalid))
          notify(
            invalid
              ? '模板无效，请检查变量与特殊字符'
              : '演示：文件名模板已保存',
          )
          if (invalid) input.focus()
          return
        }
        if (action === 'open-x') {
          window.open('https://x.com', '_blank', 'noopener,noreferrer')
          return
        }
        if (action === 'open-post') {
          window.open(
            'https://x.com/i/status/2105974296740811141',
            '_blank',
            'noopener,noreferrer',
          )
          return
        }
        const messages = {
          pause: '下载已暂停',
          resume: '已加入队列，等待继续',
          'cancel-download': '下载已取消',
          retry: '已重新创建下载',
          skip: '已跳过重复视频',
          'history-board': '在下载面板中切换到下载记录',
          'custom-color': '自定义颜色仅作交互示意',
        }
        notify(
          `演示：${messages[action] || control.getAttribute('aria-label') || '操作已完成'}`,
        )
      })
      document.addEventListener('keydown', event => {
        if (
          event.key === 'Escape'
          && document.querySelector('.context-panel')
          && !event.target.matches('select')
        ) {
          document.querySelector('.context-panel').hidden = true
          document.querySelector('.launcher').focus()
        }
      })
    </script>
  </body>
</html>
