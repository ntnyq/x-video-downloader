<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Video Downloader</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/images/downloader.svg"
    />
    <meta name="manifest.type" content="browser_action" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Give the browser action a size before its viewport-dependent layout. */
      #app:has(> main) {
        width: 360px;
        max-width: 100%;
        height: 600px;
      }

      .popup-startup {
        box-sizing: border-box;
        width: 320px;
        max-width: 100%;
        padding: 16px;
        color-scheme: light dark;
        color: CanvasText;
        background: Canvas;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }

      .popup-startup p {
        margin: 8px 0 0;
      }

      #app:has(> main) + .popup-startup {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <section class="popup-startup">
      <strong>X Video Downloader</strong>
      <p>Opening the extension…</p>
      <p>
        If this message stays visible, reload the extension. For a WXT
        development build, keep its local dev server running.
      </p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
