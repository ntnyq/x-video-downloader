guide:
  description: ダウンロード設定と使い方
  formatsHelp: MP4 動画と動画形式の GIF に対応しています。HLS のみのライブ配信や動画には未対応です。blob URL は直接保存できる MP4 ではありません。
  languageHelp: 表示言語はブラウザーの設定に従います。英語、簡体字中国語、繁体字中国語、日本語、韓国語に対応しています。
  privacyHelp: 読み込み済みの動画情報を端末内で処理します。API キーは不要で、ポスト、Cookie、ログイン情報を第三者の解析サービスへ送信することはありません。
  shortcutHelp: 'ツールバーのアイコンをクリックするか、Alt + O を押してもパネルを開けます。'
  stepOne: 動画を含む X のポストを開き、プレーヤーの読み込みを待ちます。
  stepThree: パネルで進捗を確認し、ダウンロードのキャンセルや再試行ができます。
  stepTwo: ダウンロードボタンで動画を保存できます。パネルを開くと、画質の指定や複数の動画の選択もできます。
  steps: 3 ステップで動画を保存
  title: 使い方
  troubleshootingHelp: 動画を再生してから「再検出」を押してください。インストールや更新後は X を再読み込みしてください。閲覧制限のあるポストには、閲覧権限のあるアカウントでのログインが必要です。
