  releases:
    v0_0_1:
      download: X の動画を MP4 で保存できます。画質の選択と、投稿内の動画の一括ダウンロードに対応しました。
      languages: 英語、簡体字中国語、繁体字中国語、日本語、韓国語に対応しました。
      preferences: ファイル名とカラーテーマをカスタマイズできます。標準ではブラウザーのダウンロードフォルダーに直接保存します。
    v0_0_2:
      batch: 現在のページで複数の投稿から動画を選択して、一括ダウンロードできるようになりました。
      interface: shadcn-vue を使用して操作ボタンと設定画面を刷新しました。
      position: ページを再読み込みしても、フローティングダウンロードボタンの位置を保持するようになりました。
      queue: ダウンロードキューと履歴を保存できるようになりました。一時停止、再開、再試行、重複ダウンロードの通知に対応しました。
    v0_0_3:
      interface: ダウンロードパネル、ツールバーのポップアップ、設定画面、ようこそ画面を再設計し、操作とレイアウトを統一しました。
      quickDownload: クイックダウンロード時にダウンロードパネルが意図せず開く問題を修正しました。
