guide:
  description: 下載設定與使用說明
  formatsHelp: 支援 MP4 影片與以影片形式儲存的 GIF；暫不支援僅有 HLS 分段的直播或影片。頁面中的 blob 網址不是可直接儲存的 MP4。
  languageHelp: 介面跟隨瀏覽器語言，支援英文、簡體中文、繁體中文、日文與韓文。
  privacyHelp: 擴充功能在本機讀取頁面已載入的影片資訊，不需要 API Key，也不會將貼文、Cookie 或登入資訊傳送給第三方解析服務。
  shortcutHelp: '也可以點選工具列的擴充功能圖示，或按 Alt + O 開啟下載面板。'
  stepOne: 開啟包含影片的 X 貼文，等待播放器載入。
  stepThree: 在面板查看下載進度、取消工作或重試失敗的下載。
  stepTwo: 單部影片點選下載按鈕即可儲存；也可以展開面板選擇畫質或勾選多部影片。
  steps: 三步儲存影片
  title: 使用說明
  troubleshootingHelp: 先播放影片，再點選「重新偵測」。安裝或更新後需要重新整理 X 頁面。受限貼文需要登入 X 並有權查看。
