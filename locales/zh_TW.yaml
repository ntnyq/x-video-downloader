  installedVersion: 已安裝版本：$1
  releases:
    v0_0_1:
      download: 將 X 影片儲存為 MP4，支援選擇畫質與批次下載單則貼文中的影片。
      languages: 支援英語、簡體中文、繁體中文、日語與韓語。
      preferences: 支援自訂檔名與色彩主題，預設直接儲存至瀏覽器的下載資料夾。
    v0_0_2:
      batch: 支援跨貼文選取並批次下載目前頁面的影片。
      interface: 使用 shadcn-vue 更新控制項與設定介面。
      position: 重新整理頁面後保留懸浮下載按鈕的位置。
      queue: 新增可持續保留的下載佇列與歷史紀錄，支援暫停、繼續、重試與重複下載提醒。
    v0_0_3:
      interface: 重新設計下載面板、工具列彈出視窗、設定頁與歡迎頁，統一控制項並改善版面配置。
      quickDownload: 修正快速下載時意外開啟下載面板的問題。
