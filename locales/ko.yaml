  releases:
    v0_0_1:
      download: X 동영상을 MP4로 저장할 수 있습니다. 화질 선택과 게시물 내 동영상 일괄 다운로드를 지원합니다.
      languages: 영어, 중국어 간체, 중국어 번체, 일본어 및 한국어를 지원합니다.
      preferences: 파일 이름과 색상 테마를 설정할 수 있습니다. 기본적으로 브라우저의 다운로드 폴더에 바로 저장합니다.
    v0_0_2:
      batch: 현재 페이지의 여러 게시물에서 동영상을 선택하여 일괄 다운로드할 수 있습니다.
      interface: shadcn-vue를 사용하여 컨트롤과 설정 화면을 개선했습니다.
      position: 페이지를 새로고침해도 플로팅 다운로드 버튼의 위치가 유지됩니다.
      queue: 다운로드 대기열과 기록을 지속적으로 저장합니다. 일시 정지, 재개, 재시도 및 중복 다운로드 알림을 지원합니다.
    v0_0_3:
      interface: 다운로드 패널, 도구 모음 팝업, 설정 및 시작 페이지를 새롭게 디자인하여 컨트롤과 레이아웃을 일관되게 개선했습니다.
      quickDownload: 빠른 다운로드 시 다운로드 패널이 예기치 않게 열리는 문제를 수정했습니다.
