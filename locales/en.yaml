changelog:
  currentVersion: Current version
  description: New features, improvements and fixes in each release.
  feature: ✨ New
  fix: 🐛 Fix
  improvement: ⚡ Improved
  installedVersion: 'Installed version: $1'
  releases:
    v0_0_1:
      download: Download X videos as MP4 with quality selection and batch downloads from a post.
      languages: Available in English, Simplified Chinese, Traditional Chinese, Japanese and Korean.
      preferences: Customize filenames and color themes. Save directly to your browser’s download folder by default.
    v0_0_2:
      batch: Select and download videos across multiple posts on the current page.
      interface: Updated controls and settings built with shadcn-vue.
      position: Remember the floating download button’s position after reloading the page.
      queue: Added a persistent download queue and history, with pause, resume, retry and duplicate reminders.
    v0_0_3:
      interface: Redesigned the download panel, popup, settings and welcome page with consistent controls and clearer layouts.
      quickDownload: Quick downloads no longer open the download panel unexpectedly.
