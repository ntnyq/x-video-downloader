changelog:
  currentVersion: 当前版本
  description: 查看各版本的新功能、改进和问题修复。
  feature: ✨ 新功能
  fix: 🐛 修复
  improvement: ⚡ 改进
  installedVersion: 已安装版本：$1
  releases:
    v0_0_1:
      download: 将 X 视频保存为 MP4，支持选择画质和批量下载单条帖文中的视频。
      languages: 支持英语、简体中文、繁体中文、日语和韩语。
      preferences: 支持自定义文件名和颜色主题，默认直接保存到浏览器的下载文件夹。
    v0_0_2:
      batch: 支持跨帖文选择并批量下载当前页面的视频。
      interface: 使用 shadcn-vue 更新控件和设置界面。
      position: 刷新页面后保留悬浮下载按钮的位置。
      queue: 新增持久化下载队列和历史记录，支持暂停、继续、重试和重复下载提醒。
    v0_0_3:
      interface: 重新设计下载面板、工具栏弹窗、设置页和欢迎页，统一控件并优化布局。
      quickDownload: 修复快捷下载时意外打开下载面板的问题。
  title: 更新日志
  view: 查看更新日志
