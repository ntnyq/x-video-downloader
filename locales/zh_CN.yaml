guide:
  description: 下载设置与使用说明
  formatsHelp: 支持 MP4 视频和以视频形式存储的 GIF；暂不支持仅有 HLS 分片的直播或视频。页面中的 blob 地址不是可直接保存的 MP4。
  languageHelp: 界面跟随浏览器语言，支持英文、简体中文、繁体中文、日文和韩文。
  privacyHelp: 插件在本机读取页面已加载的视频信息，不需要 API Key，也不会向第三方解析站发送帖子、Cookie 或登录信息。
  shortcutHelp: '也可以点击工具栏插件图标，或使用 Alt + O 打开下载面板。'
  stepOne: 打开包含视频的 X 帖子，等待播放器加载。
  stepThree: 在面板查看下载进度、取消任务或重试失败的下载。
  stepTwo: 单视频点击下载按钮即可保存；也可以展开面板选择画质或勾选多个视频。
  steps: 三步保存视频
  title: 使用帮助
  troubleshootingHelp: 先播放视频，再点击「重新检测」。安装或更新后需要刷新 X 页面。受限帖子需要你在 X 中正常登录并有权查看。
